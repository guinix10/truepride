<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cadastro - TruePride</title>
  <link rel="stylesheet" href="assets/css/cadastro.css" />
</head>
<body class="login-body">
  <div class="login-container">
    <img src="assets/img/logo.png" alt="TruePride Logo" class="login-logo" />
    <h1 class="login-title">Criar Conta no TruePride</h1>

    <form id="cadastroForm" class="login-form" action="php/cadastrar.php" method="POST">
      <input type="text" name="nome" placeholder="Nome" required />
      <input type="email" name="email" placeholder="Email" required />
      <input type="password" name="senha" placeholder="Senha" required />
      <div class="half-inputs">
        <input type="text" name="cpf" placeholder="CPF" required />
        <input type="text" name="numero" placeholder="Número (opcional)" />
      </div>
      <button type="submit">Cadastrar</button>
      <p>Já tem conta? <a href="login.html">Entrar</a></p>
    </form>
  </div>

  <!-- Modal de Termos (permanece igual, não precisa mudar) -->
  <div id="termsModal" class="hidden">
    <div class="box">
      <h2>Termos de Uso e Política de Privacidade</h2>
      <div id="termsContent">
        <!-- conteúdo dos termos -->
      </div>
      <button id="aceitarTermos">Concordo</button>
    </div>
  </div>

  <script src="assets/js/cadastro.js"></script>
</body>
</html>
